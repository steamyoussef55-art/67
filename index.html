<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة اللاعبين - المتجر ومنصة النشر</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --primary-neon: #00ff88;
            --secondary-neon: #b700ff;
            --vip-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8892b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: rgba(26, 26, 36, 0.9);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        h1 { margin: 0; font-size: 2rem; color: var(--primary-neon); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--primary-neon);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover { background: var(--primary-neon); color: #000; box-shadow: 0 0 15px var(--primary-neon); }
        .tab-btn.vip-tab { border-color: var(--vip-gold); color: var(--vip-gold); font-weight: bold; }
        .tab-btn.vip-tab.active, .tab-btn.vip-tab:hover { background: var(--vip-gold); color: #000; box-shadow: 0 0 15px var(--vip-gold); }

        .section { display: none; }
        .section.active { display: block; }

        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .game-card { background-color: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; padding-bottom: 15px; }
        
        .game-image {
            height: 180px; background-image: linear-gradient(45deg, #1a1a24, #2a2a35);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--text-muted); border-bottom: 1px solid #333;
        }

        .game-info { padding: 15px; }
        .game-title { color: var(--secondary-neon); margin: 0 0 10px 0; }
        .price-tag { color: var(--vip-gold); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; display: block; }

        .action-btn {
            background: transparent; color: var(--primary-neon); border: 2px solid var(--primary-neon);
            padding: 10px; border-radius: 8px; cursor: pointer; width: 90%; margin: 0 auto; display: block;
            font-weight: bold; transition: 0.3s;
        }
        .action-btn:hover { background: var(--primary-neon); color: #000; }
        .buy-btn { color: var(--vip-gold); border-color: var(--vip-gold); }
        .buy-btn:hover { background: var(--vip-gold); }

        /* نافذة الفيزا المنبثقة */
        #visa-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000;
        }
        .visa-content {
            background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center;
            border: 2px solid var(--vip-gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            max-width: 400px; width: 90%;
        }
        .visa-content input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--text-muted); color: white; border-radius: 8px; box-sizing: border-box; text-align: center;
        }
        .visa-content input:focus { border-color: var(--vip-gold); outline: none; }
        
        .loader {
            border: 4px solid #333; border-top: 4px solid var(--primary-neon);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <h1>بوابة اللاعبين 🎮</h1>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="showSection('free')">ألعاب مجانية</button>
            <button class="tab-btn vip-tab" onclick="showSection('vip')">ألعاب مدفوعة VIP 👑</button>
        </div>

        <!-- الألعاب المجانية -->
        <div id="free" class="section active">
            <div class="games-grid">
                <div class="game-card">
                    <div class="game-image">Brawlhalla</div>
                    <div class="game-info">
                        <h3 class="game-title">براولهالا</h3>
                        <p style="color: var(--text-muted);">لعبة قتال منصات مجانية.</p>
                    </div>
                    <button class="action-btn" onclick="alert('جاري بدء التحميل مجاناً! 🚀')">حمل الآن مجاناً</button>
                </div>
            </div>
        </div>

        <!-- الألعاب المدفوعة VIP -->
        <div id="vip" class="section">
            <div class="games-grid">
                <div class="game-card">
                    <div class="game-image">GTA V Premium</div>
                    <div class="game-info">
                        <h3 class="game-title">Grand Theft Auto V</h3>
                        <p style="color: var(--text-muted);">النسخة الكاملة مع الأونلاين.</p>
                        <span class="price-tag">السعر: 15 دولار</span>
                    </div>
                    <button class="action-btn buy-btn" onclick="openVisaModal('Grand Theft Auto V')">شراء بالفيزا 💳</button>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة الدفع بالفيزا -->
    <div id="visa-modal">
        <div class="visa-content">
            <h2 style="color: var(--vip-gold); margin-top: 0;">بوابة الدفع الآمن 🔒</h2>
            <p id="game-name-display" style="color: var(--text-muted);"></p>
            
            <div id="payment-form">
                <input type="text" id="cardNumber" placeholder="رقم الكارت (16 رقم)">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="expiryDate" placeholder="تاريخ الانتهاء MM/YY">
                    <input type="text" id="cvv" placeholder="الرقم السري CVV" maxlength="3">
                </div>
                <button class="action-btn buy-btn" style="width: 100%;" onclick="processPayment()">تأكيد ودفع</button>
                <button class="action-btn" style="width: 100%; margin-top: 10px; border-color: #ff4444; color: #ff4444;" onclick="closeVisaModal()">إلغاء</button>
            </div>

            <!-- شاشة التحميل الوهمية -->
            <div id="loading-screen" style="display: none;">
                <div class="loader"></div>
                <p style="color: var(--primary-neon);">جاري التأكد من صحة الكارت...</p>
            </div>

            <!-- شاشة نجاح الدفع وظهور التحميل -->
            <div id="success-screen" style="display: none;">
                <h2 style="color: var(--primary-neon);">✅ تم الدفع بنجاح!</h2>
                <p style="color: var(--text-muted);">شكراً لشرائك. اللعبة جاهزة للتحميل الآن.</p>
                <button class="action-btn" style="background: var(--primary-neon); color: #000; width: 100%;" onclick="startDownload()">⬇️ تحميل اللعبة فوراً</button>
                <button class="action-btn" style="width: 100%; margin-top: 10px; border-color: #333; color: var(--text-muted);" onclick="closeVisaModal()">العودة للمتجر</button>
            </div>

        </div>
    </div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        function openVisaModal(gameName) {
            document.getElementById('game-name-display').innerText = "شراء: " + gameName;
            
            // تصفير الخانات
            document.getElementById('cardNumber').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('cvv').value = '';

            document.getElementById('payment-form').style.display = 'block';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'none';
            document.getElementById('visa-modal').style.display = 'flex';
        }

        function closeVisaModal() {
            document.getElementById('visa-modal').style.display = 'none';
        }

        function processPayment() {
            let card = document.getElementById('cardNumber').value;
            let cvv = document.getElementById('cvv').value;

            // 1. الكود السري الخاص بيوسف (تخطي الدفع)
            if (card === "يو 1 2" || card === "يويو") {
                showSuccessScreen();
                return;
            }

            // 2. فحص الفيزا العادية للناس التانية (لازم 16 رقم)
            let isCardNumberOnly = /^\d+$/.test(card); // يتأكد إنها أرقام بس
            let isCvvNumberOnly = /^\d+$/.test(cvv);

            if (card.length !== 16 || !isCardNumberOnly) {
                alert("❌ فشل الدفع: رقم الكارت غير صحيح! يجب أن يتكون من 16 رقم.");
                return;
            }
            
            if (cvv.length !== 3 || !isCvvNumberOnly) {
                alert("❌ فشل الدفع: الرقم السري (CVV) غير صحيح! يجب أن يكون 3 أرقام.");
                return;
            }

            // لو البيانات مظبوطة، نعرض شاشة التحميل كأنه بيكلم البنك
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            setTimeout(() => {
                showSuccessScreen();
            }, 2500); // الموقع بيحمل ثانيتين ونص عشان يبان حقيقي
        }

        function showSuccessScreen() {
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
        }

        function startDownload() {
            alert('بدأ التحميل! 🚀 (تقدر تعدل الكود وتحط لينك التحميل الفعلي هنا)');
        }
    </script>
</body>
</html>
