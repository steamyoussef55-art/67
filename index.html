<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>YOUSSEF GAMES</title>
<style>
body { background:#171a21; color:white; font-family:Arial; margin:0; }
.top { background:#171a21; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
.top h1 { color:#66c0f4; margin:0; font-size:22px; }
.top input { padding:10px; width:220px; border-radius:5px; border:none; }
.loginBtn { background:#66c0f4; color:black; border:none; padding:10px 18px; border-radius:5px; cursor:pointer; font-weight:bold; }
.games { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; padding:30px; }
.game { background:#1b2838; width:280px; border-radius:10px; overflow:hidden; text-align:center; padding-bottom:20px; }
.game img { width:100%; height:160px; object-fit:cover; }
.price { color:#a1cd44; font-weight:bold; }
.btn { background:#5c7e10; color:white; border:none; padding:12px 25px; font-size:18px; border-radius:5px; cursor:pointer; }
#admin { display:none; background:#2a475e; margin:20px; padding:20px; border-radius:10px; text-align:center; }
#admin input { display:block; width:80%; margin:10px auto; padding:10px; border-radius:5px; border:none; }
#loginBox { display:none; background:#2a475e; margin:20px; padding:20px; border-radius:10px; text-align:center; }
</style>
</head>
<body>

<div class="top">
<h1>🎮 YOUSSEF GAMES</h1>
<input type="text" placeholder="🔍 دور على لعبة...">
<button class="loginBtn" onclick="showLogin()">تسجيل دخول</button>
</div>

<div id="loginBox">
<h2>تسجيل دخول المدير</h2>
<input type="password" id="pass" placeholder="اكتب كلمة السر">
<br><br>
<button class="loginBtn" onclick="login()">دخول</button>
<p id="msg"></p>
</div>

<div id="admin">
<h2>👑 اهلا بيك يا مدير - يوسف</h2>
<p>هنا تضيف لعبة جديدة للموقع</p>
<input type="text" id="gameName" placeholder="اسم اللعبة">
<input type="text" id="gameImg" placeholder="رابط صورة اللعبة">
<input type="text" id="gameDesc" placeholder="وصف اللعبة">
<button class="btn" onclick="addGame()">+ اضافة لعبة</button>
</div>

<h2 style="text-align:center;">🔥 العاب مجانية</h2>
<div class="games" id="gamesList">
<div class="game"><img src="https://picsum.photos/300/160?1"><h2>لعبة شخصيات الورق</h2><p>جمع النجوم</p><p class="price">مجانية</p><button class="btn">⬇️ تحميل</button></div>
<div class="game"><img src="https://picsum.photos/300/160?2"><h2>لعبة المغامرة</h2><p>اجري واجمع الفلوس</p><p class="price">مجانية</p><button class="btn">⬇️ تحميل</button></div>
<div class="game"><img src="https://picsum.photos/300/160?3"><h2>لعبة سباق</h2><p>سابق صحابك</p><p class="price">مجانية</p><button class="btn">⬇️ تحميل</button></div>
</div>

<script>
function showLogin(){ document.getElementById('loginBox').style.display='block'; }
function login(){
  let p = document.getElementById('pass').value;
  if(p == '123456789'){
    document.getElementById('admin').style.display='block';
    document.getElementById('loginBox').style.display='none';
    document.getElementById('msg').innerHTML='';
    alert('اهلا بيك يا مدير يوسف! 👑');
  } else {
    document.getElementById('msg').innerHTML='كلمة السر غلط! ده لمدير بس';
  }
}
function addGame(){
  let name = document.getElementById('gameName').value;
  let img = document.getElementById('gameImg').value;
  let desc = document.getElementById('gameDesc').value;
  if(!name){ alert('اكتب اسم اللعبة الاول'); return; }
  if(!img) img = 'https://picsum.photos/300/160?random';
  let div = document.createElement('div');
  div.className='game';
  div.innerHTML = '<img src="'+img+'"><h2>'+name+'</h2><p>'+desc+'</p><p class="price">مجانية</p><button class="btn">⬇️ تحميل</button>';
  document.getElementById('gamesList').appendChild(div);
  alert('تم اضافة اللعبة! ✅');
}
</script>
</body>
</html>
