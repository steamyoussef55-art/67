<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة اللاعبين - المتجر المتكامل</title>
    <style>
        :root {
            --bg-color: #0f0f13; --card-bg: #1a1a24;
            --primary-neon: #00ff88; --secondary-neon: #b700ff;
            --vip-gold: #ffd700; --text-main: #ffffff; --text-muted: #8892b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0;
        }

        header {
            background-color: rgba(26, 26, 36, 0.9); padding: 20px; text-align: center;
            border-bottom: 2px solid var(--primary-neon); box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        h1 { margin: 0; font-size: 2rem; color: var(--primary-neon); }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Login Section */
        #login-section {
            background: var(--card-bg); padding: 40px; border-radius: 15px;
            max-width: 400px; margin: 50px auto; border: 1px solid var(--secondary-neon);
            box-shadow: 0 0 20px rgba(183, 0, 255, 0.2); text-align: center;
        }
        #login-section input {
            width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--text-muted); color: white; border-radius: 8px; box-sizing: border-box;
        }
        #login-section input:focus { border-color: var(--primary-neon); outline: none; }

        /* Store Section */
        #store-section { display: none; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--primary-neon);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--primary-neon); color: #000; box-shadow: 0 0 15px var(--primary-neon); }
        .tab-btn.vip-tab { border-color: var(--vip-gold); color: var(--vip-gold); font-weight: bold; }
        .tab-btn.vip-tab.active, .tab-btn.vip-tab:hover { background: var(--vip-gold); color: #000; box-shadow: 0 0 15px var(--vip-gold); }

        .section { display: none; }
        .section.active { display: block; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .game-card { background-color: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #333; padding-bottom: 15px; }
        .game-image {
            height: 180px; background-image: linear-gradient(45deg, #1a1a24, #2a2a35);
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
            color: var(--text-muted); border-bottom: 1px solid #333;
        }
        .game-info { padding: 15px; }
        .game-title { color: var(--secondary-neon); margin: 0 0 10px 0; }
        .price-tag { color: var(--vip-gold); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; display: block; }

        .action-btn {
            background: transparent; color: var(--primary-neon); border: 2px solid var(--primary-neon);
            padding: 10px; border-radius: 8px; cursor: pointer; width: 90%; margin: 5px auto; display: block;
            font-weight: bold; transition: 0.3s;
        }
        .action-btn:hover { background: var(--primary-neon); color: #000; }
        .buy-btn { color: var(--vip-gold); border-color: var(--vip-gold); }
        .buy-btn:hover { background: var(--vip-gold); color: #000; }
        
        /* زر الأدمن لتعديل الروابط */
        .edit-btn {
            display: none; background: transparent; color: #ff9800; border: 1px dashed #ff9800;
            padding: 8px; border-radius: 8px; cursor: pointer; width: 90%; margin: 5px auto; font-weight: bold;
        }
        .edit-btn:hover { background: #ff9800; color: #000; }

        /* Visa Modal */
        #visa-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000;
        }
        .visa-content {
            background: var(--card-bg); padding: 30px; border-radius: 15px; text-align: center;
            border: 2px solid var(--vip-gold); box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); max-width: 400px; width: 90%;
        }
        .visa-content input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--text-muted); color: white; border-radius: 8px; box-sizing: border-box; text-align: center;
        }
        .visa-content input:focus { border-color: var(--vip-gold); outline: none; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary-neon); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>بوابة اللاعبين 🎮</h1>
    </header>

    <div class="container">
        
        <!-- قسم تسجيل الدخول -->
        <div id="login-section">
            <h2 style="color: var(--primary-neon);">تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button class="action-btn" onclick="login()">دخول</button>
        </div>

        <!-- قسم المتجر (مخفي حتى تسجيل الدخول) -->
        <div id="store-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="showSection('free')">ألعاب مجانية</button>
                <button class="tab-btn vip-tab" onclick="showSection('vip')">ألعاب مدفوعة VIP 👑</button>
            </div>

            <!-- الألعاب المجانية -->
            <div id="free" class="section active">
                <div class="games-grid">
                    <div class="game-card">
                        <div class="game-image">Brawlhalla</div>
                        <div class="game-info">
                            <h3 class="game-title">براولهالا</h3>
                            <p style="color: var(--text-muted);">لعبة قتال منصات مجانية.</p>
                        </div>
                        <button class="action-btn" onclick="downloadGame('brawlhalla')">حمل الآن مجاناً</button>
                        <button class="edit-btn" onclick="editLink('brawlhalla')">⚙️ تعديل رابط التحميل</button>
                    </div>
                </div>
            </div>

            <!-- الألعاب المدفوعة VIP -->
            <div id="vip" class="section">
                <div class="games-grid">
                    <div class="game-card">
                        <div class="game-image">GTA V Premium</div>
                        <div class="game-info">
                            <h3 class="game-title">Grand Theft Auto V</h3>
                            <p style="color: var(--text-muted);">النسخة الكاملة مع الأونلاين.</p>
                            <span class="price-tag">السعر: 15 دولار</span>
                        </div>
                        <button class="action-btn buy-btn" onclick="openVisaModal('gta5', 'Grand Theft Auto V')">شراء بالفيزا 💳</button>
                        <button class="edit-btn" onclick="editLink('gta5')">⚙️ تعديل رابط التحميل</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- شاشة الدفع بالفيزا -->
    <div id="visa-modal">
        <div class="visa-content">
            <h2 style="color: var(--vip-gold); margin-top: 0;">بوابة الدفع الآمن 🔒</h2>
            <p id="game-name-display" style="color: var(--text-muted);"></p>
            
            <div id="payment-form">
                <input type="text" id="cardNumber" placeholder="رقم الكارت (16 رقم)">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="expiryDate" placeholder="MM/YY">
                    <input type="text" id="cvv" placeholder="CVV (3 أرقام)">
                </div>
                <button class="action-btn buy-btn" style="width: 100%;" onclick="processPayment()">تأكيد ودفع</button>
                <button class="action-btn" style="width: 100%; margin-top: 10px; border-color: #ff4444; color: #ff4444;" onclick="closeVisaModal()">إلغاء</button>
            </div>

            <div id="loading-screen" style="display: none;">
                <div class="loader"></div>
                <p style="color: var(--primary-neon);">جاري فحص الكارت...</p>
            </div>

            <div id="success-screen" style="display: none;">
                <h2 style="color: var(--primary-neon);">✅ تم الدفع بنجاح!</h2>
                <button class="action-btn" style="background: var(--primary-neon); color: #000; width: 100%;" onclick="downloadGame(currentGameId)">⬇️ تحميل اللعبة فوراً</button>
            </div>
        </div>
    </div>

    <script>
        // قاعدة بيانات الروابط (تبدأ فارغة وأنت كأدمن بتعدلها)
        let gameLinks = {
            'brawlhalla': 'https://www.brawlhalla.com/play',
            'gta5': 'https://www.rockstargames.com/gta-v'
        };

        let currentGameId = '';
        let isAdmin = false;

        // نظام تسجيل الدخول
        function login() {
            let user = document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();

            if(user === '' || pass === '') {
                alert('اكتب الاسم وكلمة المرور!');
                return;
            }

            // تفعيل نظام المدير (الأدمن)
            if(user === 'يوسف' && pass === '2031') {
                isAdmin = true;
                alert('أهلاً بك يا مدير الموقع! تم تفعيل لوحة تحكم الروابط.');
                // إظهار أزرار التعديل
                document.querySelectorAll('.edit-btn').forEach(btn => btn.style.display = 'block');
            } else {
                alert('تم تسجيل الدخول كلاعب عادي.');
            }

            document.getElementById('login-section').style.display = 'none';
            document.getElementById('store-section').style.display = 'block';
        }

        // التنقل بين الأقسام
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        // تعديل الرابط الحقيقي (للمدير فقط)
        function editLink(gameId) {
            if(!isAdmin) return;
            let currentLink = gameLinks[gameId];
            let newLink = prompt("أدخل رابط التحميل الحقيقي للعبة:", currentLink);
            
            if(newLink !== null && newLink.trim() !== "") {
                gameLinks[gameId] = newLink.trim();
                alert("تم تحديث الرابط بنجاح! أي شخص سيحمل اللعبة الآن سيذهب للرابط الجديد.");
            }
        }

        // فتح رابط التحميل الفعلي
        function downloadGame(gameId) {
            let link = gameLinks[gameId];
            if(link) {
                window.open(link, '_blank'); // يفتح الرابط في صفحة جديدة
            } else {
                alert('لم يتم وضع رابط لهذه اللعبة بعد.');
            }
        }

        // دوال الفيزا
        function openVisaModal(gameId, gameTitle) {
            currentGameId = gameId;
            document.getElementById('game-name-display').innerText = "شراء: " + gameTitle;
            document.getElementById('cardNumber').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('cvv').value = '';
            document.getElementById('payment-form').style.display = 'block';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'none';
            document.getElementById('visa-modal').style.display = 'flex';
        }

        function closeVisaModal() {
            document.getElementById('visa-modal').style.display = 'none';
        }

        function processPayment() {
            let card = document.getElementById('cardNumber').value.trim();
            let cvv = document.getElementById('cvv').value.trim();

            // 1. كود يوسف السري لتخطي الدفع
            if (card === "يو 1 2" || card === "يويو") {
                showSuccessScreen();
                return;
            }

            // 2. التحقق الصارم من الأرقام فقط (بدون حروف نهائياً)
            let is16Digits = /^\d{16}$/.test(card); // يجب أن يكون 16 رقم فقط
            let is3Digits = /^\d{3}$/.test(cvv);   // يجب أن يكون 3 أرقام فقط

            if (!is16Digits) {
                alert("❌ خطأ: رقم الكارت غير صحيح! يجب كتابة 16 رقم بالضبط ولا يقبل حروف أو مسافات.");
                return;
            }
            if (!is3Digits) {
                alert("❌ خطأ: الرقم السري (CVV) غير صحيح! يجب كتابة 3 أرقام فقط.");
                return;
            }

            // نجاح الفحص
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            setTimeout(() => { showSuccessScreen(); }, 2000);
        }

        function showSuccessScreen() {
            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
        }
    </script>
</body>
</html>
