<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Youssef Store - المتجر المتكامل</title>
    <style>
        :root {
            --bg-color: #1b2838;
            --card-bg: #171a21;
            --primary-neon: #66c0f4;
            --secondary-neon: #4b6a94; 
            --vip-gold: #ffd700; 
            --text-main: #ffffff; 
            --text-muted: #c6d4df; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 0;
        }

        header {
            background-color: #171a21; padding: 15px 20px;
            border-bottom: 2px solid var(--primary-neon);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        h1 { margin: 0; font-size: 1.8rem; color: var(--primary-neon); }
        
        .header-btns { display: flex; gap: 10px; }
        .header-btn {
            background: var(--card-bg); color: var(--text-main); border: 1px solid var(--primary-neon);
            padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: 0.3s;
        }
        .header-btn:hover { background: var(--primary-neon); color: #000; }
        #logout-btn { display: none; border-color: #ff4444; color: #ff4444; }
        #logout-btn:hover { background: #ff4444; color: white; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        #login-section {
            background: var(--card-bg); padding: 40px; border-radius: 8px;
            max-width: 400px; margin: 50px auto; border: 1px solid var(--secondary-neon);
            text-align: center;
        }
        input, textarea, select {
            width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--text-muted); color: white; border-radius: 4px; box-sizing: border-box; font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--primary-neon); outline: none; }

        #store-section { display: none; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--secondary-neon);
            padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--primary-neon); color: #000; border-color: var(--primary-neon); }
        .tab-btn.vip-tab { border-color: var(--vip-gold); color: var(--vip-gold); font-weight: bold; }
        .tab-btn.vip-tab.active, .tab-btn.vip-tab:hover { background: var(--vip-gold); color: #000; }
        .tab-btn.friends-tab { border-color: #00bcd4; color: #00bcd4; }
        .tab-btn.friends-tab.active { background: #00bcd4; color: #000; }

        .section { display: none; }
        .section.active { display: block; }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .game-card { 
            background-color: var(--card-bg); border-radius: 8px; overflow: hidden; 
            border: 1px solid var(--secondary-neon); padding-bottom: 15px; position: relative;
            transition: 0.3s;
        }
        .game-card:hover { border-color: var(--primary-neon); box-shadow: 0 0 10px var(--primary-neon); }
        .game-image {
            height: 150px; background-image: linear-gradient(45deg, #10141d, #1a2430);
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            color: var(--text-muted); font-weight: bold;
        }
        .game-info { padding: 15px; }
        .game-title { color: var(--text-main); margin: 0 0 5px 0; font-size: 1.3rem; }
        .price-tag { color: var(--primary-neon); font-weight: bold; font-size: 1.1rem; display: block; margin-bottom: 10px; }

        .delete-btn {
            display: none; position: absolute; top: 10px; right: 10px;
            background: #ff4444; color: white; border: none; border-radius: 4px;
            width: 30px; height: 30px; cursor: pointer; font-size: 1rem; line-height: 30px; text-align: center;
        }

        .action-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--primary-neon);
            padding: 10px; border-radius: 4px; cursor: pointer; width: 90%; margin: 5px auto; display: block; font-weight: bold;
            transition: 0.3s;
        }
        .action-btn:hover { background: var(--primary-neon); color: #000; }
        .buy-btn { color: var(--primary-neon); }
        .buy-btn:hover { background: var(--primary-neon); }
        
        .edit-btn {
            display: none; background: transparent; color: #ff9800; border: 1px dashed #ff9800;
            padding: 8px; border-radius: 4px; cursor: pointer; width: 90%; margin: 5px auto; font-weight: bold;
            transition: 0.3s;
        }
        .edit-btn:hover { background: #ff9800; color: #000; }

        .friends-container { background: var(--card-bg); padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; border: 1px solid var(--secondary-neon); }
        .friend-item { background: rgba(0,0,0,0.5); padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .del-friend { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        .publish-form { background: var(--card-bg); padding: 30px; border-radius: 8px; border: 1px solid var(--secondary-neon); max-width: 500px; margin: 0 auto; }

        #visa-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .visa-content { background: var(--card-bg); padding: 30px; border-radius: 8px; text-align: center; border: 1px solid var(--primary-neon); max-width: 400px; width: 90%; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary-neon); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Youssef Store 🎮</h1>
        <div class="header-btns">
            <button class="header-btn" onclick="downloadStoreFile()">⬇️ تحميل المتجر</button>
            <button id="logout-btn" class="header-btn" onclick="logout()">تسجيل خروج</button>
        </div>
    </header>

    <div class="container">
        <div id="login-section">
            <h2 style="color: var(--primary-neon);">تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button class="action-btn" onclick="login()">دخول للمتجر</button>
        </div>

        <div id="store-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="showSection('free')">ألعاب مجانية</button>
                <button class="tab-btn vip-tab" onclick="showSection('vip')">ألعاب VIP 👑</button>
                <button class="tab-btn friends-tab" onclick="showSection('friends')">الأصدقاء 👥</button>
                <button class="tab-btn" onclick="showSection('publish')">نشر لعبتك 🚀</button>
            </div>

            <div id="free" class="section active"><div class="games-grid" id="free-games-grid"></div></div>
            <div id="vip" class="section"><div class="games-grid" id="vip-games-grid"></div></div>

            <div id="friends" class="section">
                <div class="friends-container">
                    <h2 style="color: #00bcd4; text-align: center;">قائمة الأصدقاء 👥</h2>
                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <input type="text" id="friendName" placeholder="اكتب اسم صديقك هنا..." style="margin: 0;">
                        <button class="action-btn" style="width: auto; margin: 0; border-color: #00bcd4; color: #00bcd4;" onclick="addFriend()">إضافة</button>
                    </div>
                    <div id="friends-list"></div>
                </div>
            </div>

            <div id="publish" class="section">
                <div class="publish-form">
                    <h2 style="color: var(--secondary-neon); text-align: center;">ارفع لعبتك على المتجر! 🚀</h2>
                    <input type="text" placeholder="اسم اللعبة" id="gName">
                    <input type="text" placeholder="رابط اللعبة" id="gLink">
                    <select id="gType">
                        <option value="free">لعبة مجانية</option>
                        <option value="vip">لعبة مدفوعة (VIP)</option>
                    </select>
                    <input type="number" placeholder="السعر (اكتب 0 لو مجانية)" id="gPrice" value="0">
                    <textarea placeholder="وصف اللعبة" rows="3" id="gDesc"></textarea>
                    <button class="action-btn" onclick="publishGame()" style="background: var(--primary-neon); color: #000; border: none;">نشر اللعبة الآن</button>
                </div>
            </div>
        </div>
    </div>

    <div id="visa-modal">
        <div class="visa-content">
            <h2 style="color: var(--vip-gold); margin-top: 0;">بوابة الدفع الآمن 🔒</h2>
            <p id="game-name-display" style="color: var(--text-muted);"></p>
            <div id="payment-form">
                <input type="text" id="cardNumber" placeholder="رقم الكارت (16 رقم)">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="expiryDate" placeholder="MM/YY">
                    <input type="text" id="cvv" placeholder="CVV">
                </div>
                <button class="action-btn buy-btn" style="width: 100%;" onclick="processPayment()">تأكيد ودفع</button>
                <button class="action-btn" style="width: 100%; margin-top: 10px; border-color: #ff4444; color: #ff4444;" onclick="closeVisaModal()">إلغاء</button>
            </div>
            <div id="loading-screen" style="display: none;"><div class="loader"></div><p>جاري فحص الكارت...</p></div>
            <div id="success-screen" style="display: none;">
                <h2 style="color: var(--primary-neon);">✅ تم الدفع بنجاح!</h2>
                <button class="action-btn" style="background: var(--primary-neon); color: #000; width: 100%;" onclick="downloadGame(currentGameLink)">⬇️ تحميل اللعبة فوراً</button>
            </div>
        </div>
    </div>

    <script>
        let defaultGames = [
            { id: 1, title: 'Brawlhalla', desc: 'لعبة قتال منصات مجانية.', type: 'free', price: 0, link: 'https://www.brawlhalla.com' },
            { id: 2, title: 'Roblox', desc: 'اصنع عوالمك الخاصة والعب مع أصدقائك.', type: 'free', price: 0, link: 'https://www.roblox.com' },
            { id: 3, title: 'GTA V Premium', desc: 'النسخة الكاملة مع الأونلاين.', type: 'vip', price: 15, link: 'https://www.rockstargames.com/gta-v' },
            { id: 4, title: 'Minecraft', desc: 'حساب أصلي لدخول السيرفرات الخاصة.', type: 'vip', price: 10, link: 'https://www.minecraft.net' }
        ];

        let gamesList = JSON.parse(localStorage.getItem('myStoreGames')) || defaultGames;
        let friendsList = JSON.parse(localStorage.getItem('myFriends')) || [];
        let isAdmin = localStorage.getItem('isAdmin') === 'true';
        let currentGameLink = '';

        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('store-section').style.display = 'block';
                document.getElementById('logout-btn').style.display = 'inline-block';
                renderGames();
                renderFriends();
            }
        };

        function login() {
            let user = document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();
            if(user === '' || pass === '') { alert('اكتب الاسم وكلمة المرور!'); return; }

            localStorage.setItem('isLoggedIn', 'true');
            
            // تم التعديل هنا لاسم المستخدم والباسورد الجديدين
            if(user === 'YoussefGG.123' && pass === '123') {
                localStorage.setItem('isAdmin', 'true'); isAdmin = true;
                alert('أهلاً يا مدير الموقع! أزرار المسح والتعديل اتفعلت ليك.');
            } else {
                localStorage.setItem('isAdmin', 'false'); isAdmin = false;
            }

            document.getElementById('login-section').style.display = 'none';
            document.getElementById('store-section').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'inline-block';
            renderGames(); renderFriends();
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('isAdmin');
            location.reload();
        }

        function renderGames() {
            let freeGrid = document.getElementById('free-games-grid');
            let vipGrid = document.getElementById('vip-games-grid');
            freeGrid.innerHTML = ''; vipGrid.innerHTML = '';

            gamesList.forEach(game => {
                let card = document.createElement('div');
                card.className = 'game-card';
                let deleteBtnHtml = isAdmin ? `<button class="delete-btn" style="display:block" onclick="deleteGame(${game.id})">🗑️</button>` : '';
                let editBtnHtml = isAdmin ? `<button class="edit-btn" style="display:block" onclick="editLink(${game.id})">⚙️ تعديل الرابط</button>` : '';

                let actionBtnHtml = game.type === 'free' 
                    ? `<button class="action-btn" onclick="downloadGame('${game.link}')">حمل الآن مجاناً</button>`
                    : `<button class="action-btn buy-btn" onclick="openVisaModal('${game.link}', '${game.title}')">شراء بـ ${game.price}$ 💳</button>`;

                card.innerHTML = `
                    ${deleteBtnHtml}
                    <div class="game-image">${game.title}</div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p style="color: var(--text-muted);">${game.desc}</p>
                    </div>
                    ${actionBtnHtml}
                    ${editBtnHtml}
                `;

                if (game.type === 'free') freeGrid.appendChild(card);
                else vipGrid.appendChild(card);
            });
        }

        function publishGame() {
            let title = document.getElementById('gName').value.trim();
            let link = document.getElementById('gLink').value.trim();
            let type = document.getElementById('gType').value;
            let price = document.getElementById('gPrice').value;
            let desc = document.getElementById('gDesc').value.trim();

            if(!title || !link) { alert("لازم تكتب اسم اللعبة والرابط!"); return; }

            let newGame = { id: Date.now(), title: title, desc: desc, type: type, price: price, link: link };
            gamesList.push(newGame);
            localStorage.setItem('myStoreGames', JSON.stringify(gamesList));
            
            alert("تم إضافة اللعبة بنجاح للمتجر!");
            document.getElementById('gName').value = ''; document.getElementById('gLink').value = ''; document.getElementById('gDesc').value = '';
            renderGames();
            showSection(type);
        }

        function deleteGame(id) {
            if(confirm("متأكد إنك عايز تمسح اللعبة دي؟")) {
                gamesList = gamesList.filter(g => g.id !== id);
                localStorage.setItem('myStoreGames', JSON.stringify(gamesList));
                renderGames();
            }
        }

        function editLink(id) {
            let gameIndex = gamesList.findIndex(g => g.id === id);
            if(gameIndex > -1) {
                let newLink = prompt("أدخل رابط التحميل الجديد:", gamesList[gameIndex].link);
                if(newLink) {
                    gamesList[gameIndex].link = newLink.trim();
                    localStorage.setItem('myStoreGames', JSON.stringify(gamesList));
                    alert("تم تحديث الرابط!");
                    renderGames();
                }
            }
        }

        function downloadGame(link) { window.open(link, '_blank'); }

        function renderFriends() {
            let list = document.getElementById('friends-list');
            list.innerHTML = '';
            friendsList.forEach((friend, index) => {
                list.innerHTML += `
                    <div class="friend-item">
                        <strong>👤 ${friend}</strong>
                        <button class="del-friend" onclick="removeFriend(${index})">حذف</button>
                    </div>
                `;
            });
        }

        function addFriend() {
            let name = document.getElementById('friendName').value.trim();
            if(name) {
                friendsList.push(name);
                localStorage.setItem('myFriends', JSON.stringify(friendsList));
                document.getElementById('friendName').value = '';
                renderFriends();
            }
        }

        function removeFriend(index) {
            friendsList.splice(index, 1);
            localStorage.setItem('myFriends', JSON.stringify(friendsList));
            renderFriends();
        }

        function downloadStoreFile() {
            let content = document.documentElement.outerHTML;
            let blob = new Blob([content], {type: "text/html"});
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Youssef_Store.html";
            link.click();
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            let activeBtn = document.querySelector(`.tab-btn[onclick="showSection('${sectionId}')"]`);
            if(activeBtn) activeBtn.classList.add('active');
            
            if(sectionId === 'publish') {
                event.target.style.background = 'var(--secondary-neon)'; event.target.style.color = '#fff';
            }
        }

        function openVisaModal(link, title) {
            currentGameLink = link;
            document.getElementById('game-name-display').innerText = "شراء: " + title;
            document.getElementById('cardNumber').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('cvv').value = '';
            document.getElementById('payment-form').style.display = 'block';
            document.getElementById('success-screen').style.display = 'none';
            document.getElementById('visa-modal').style.display = 'flex';
        }
        function closeVisaModal() { document.getElementById('visa-modal').style.display = 'none'; }
        
        function processPayment() {
            let card = document.getElementById('cardNumber').value.trim();
            let cvv = document.getElementById('cvv').value.trim();

            if (card === "يو 1 2" || card === "يويو") {
                document.getElementById('payment-form').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
                return;
            }

            if (!/^\d{16}$/.test(card) \vert{}\vert{} !/^\d{3}$/.test(cvv)) {
                alert("كد من كتابة 16 رقم للكارت و 3 أرقام للرقم السري.");
                return;
            }

            document.getElementById('payment-form').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';
            setTimeout(() => { 
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
            }, 2000);
        }
    </script>
</body>
</html>
