<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOE GAMES - مدير الموقع</title>
    <style>
        :root {
            --primary: #171a21;
            --secondary: #1b2838;
            --accent: #66c0f4;
            --text: #c7d5e0;
            --danger: #d9534f;
            --success: #5cb85c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--secondary);
            color: var(--text);
        }

        header {
            background-color: var(--primary);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
        }

        nav button, .admin-only {
            background-color: var(--accent);
            border: none;
            color: var(--primary);
            padding: 0.5rem 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .admin-only {
            display: none;
            background-color: var(--success);
            color: white;
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .game-card {
            background-color: var(--primary);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 0.5rem;
            margin-top: 0.5rem;
            cursor: pointer;
            display: none;
        }

        #login-section {
            background-color: var(--primary);
            padding: 2rem;
            border-radius: 8px;
            width: 300px;
            margin: 2rem auto;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<header>
    <h1>JOE GAMES</h1>
    <div>
        <span id="user-status">زائر</span>
        <button onclick="toggleLogin()" id="login-btn">دخول المدير</button>
    </div>
</header>

<div class="container">
    <div id="login-section" style="display: none;">
        <h3>تسجيل دخول المدير</h3>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleLogin()">دخول</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>مكتبة الألعاب</h2>
        <button class="admin-only" id="add-game-btn" onclick="showAddGameModal()">+ إضافة لعبة</button>
    </div>

    <div class="games-grid" id="games-container">
        <!-- الألعاب هتظهر هنا -->
    </div>
</div>

<!-- مودال إضافة لعبة بسيط -->
<div id="add-modal" style="display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: var(--primary); padding: 2rem; border-radius: 8px; border: 1px solid var(--accent);">
    <h3>إضافة لعبة جديدة</h3>
    <input type="text" id="game-name" placeholder="اسم اللعبة">
    <input type="text" id="game-image" placeholder="رابط الصورة">
    <input type="text" id="game-url" placeholder="رابط التحميل">
    <button onclick="addGame()">حفظ</button>
    <button onclick="document.getElementById('add-modal').style.display='none'">إلغاء</button>
</div>

<script>
    let isAdmin = false;
    let games = [
        { id: 1, name: "لعبة تجريبية 1", image: "https://via.placeholder.com/150", url: "#" },
        { id: 2, name: "لعبة تجريبية 2", image: "https://via.placeholder.com/150", url: "#" }
    ];

    function renderGames() {
        const container = document.getElementById('games-container');
        container.innerHTML = '';
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <img src="${game.image}" alt="${game.name}">
                <h3>${game.name}</h3>
                <a href="${game.url}" style="color: var(--accent);">تحميل</a>
                <button class="delete-btn" style="display: ${isAdmin ? 'block' : 'none'};" onclick="deleteGame(${game.id})">حذف</button>
            `;
            container.appendChild(card);
        });
    }

    function toggleLogin() {
        const loginSection = document.getElementById('login-section');
        loginSection.style.display = loginSection.style.display === 'none' ? 'block' : 'none';
    }

    function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === 'يوسف13' && pass === '123456789') {
            isAdmin = true;
            document.getElementById('user-status').innerText = 'المSير (يوسف13)';
            document.getElementById('login-btn').innerText = 'خروج';
            document.getElementById('login-section').style.display = 'none';
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
            renderGames();
            alert('تم تسجيل دخول المدير بنجاح!');
        } else {
            alert('بيانات الدخول غير صحيحة.');
        }
    }

    function showAddGameModal() {
        document.getElementById('add-modal').style.display = 'block';
    }

    function addGame() {
        const name = document.getElementById('game-name').value;
        const image = document.getElementById('game-image').value;
        const url = document.getElementById('game-url').value;

        if (name && url) {
            games.push({ id: Date.now(), name, image: image || 'https://via.placeholder.com/150', url });
            renderGames();
            document.getElementById('add-modal').style.display = 'none';
        } else {
            alert('يرجى ملء البيانات المطلوبة.');
        }
    }

    function deleteGame(id) {
        games = games.filter(g => g.id !== id);
        renderGames();
    }

    renderGames();
</script>

</body>
</html>
